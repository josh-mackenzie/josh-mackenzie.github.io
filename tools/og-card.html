<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box;
    padding: 88px 96px;
    background: #1e5b45; color: #fff;
    font-family: "IBM Plex Sans", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .role { font: 500 30px/1 "IBM Plex Mono", monospace; color: #a8d9bf; letter-spacing: 0.01em; }
  h1 { margin: 26px 0 0; font-size: 112px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  p { margin: 34px 0 0; max-width: 900px; font-size: 34px; line-height: 1.4; color: #d7eadf; }
  .foot { display: flex; justify-content: space-between; align-items: center;
          font: 400 26px/1 "IBM Plex Mono", monospace; color: #a8d9bf;
          border-top: 2px solid rgba(168, 217, 191, 0.35); padding-top: 30px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #a8d9bf; margin-right: 14px; vertical-align: 2px; }
</style>
</head>
<body>
  <div>
    <div class="role">Data Engineer · UK-based</div>
    <h1>Josh Mackenzie</h1>
    <p>Data platforms end to end: Python, dbt, Azure and <span style="white-space:nowrap">LLM-powered</span> data tools.</p>
  </div>
  <div class="foot">
    <span>joshmackenzie.co.uk</span>
    <span><span class="dot"></span>Open to remote roles</span>
  </div>
</body>
</html>
