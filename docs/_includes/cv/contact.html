{%- assign b = site.data.cv.basics -%}
<ul class="cv-head__contact">
    <li><a href="mailto:{{ b.cv_email }}">{{ b.cv_email }}</a></li>
    <li><a href="https://{{ b.website }}">{{ b.website }}</a></li>
    <li><a href="https://www.linkedin.com/in/{{ b.linkedin }}/" target="_blank" rel="noopener">linkedin.com/in/{{ b.linkedin }}</a></li>
    <li><a href="https://github.com/{{ b.github }}" target="_blank" rel="noopener">github.com/{{ b.github }}</a></li>
</ul>
