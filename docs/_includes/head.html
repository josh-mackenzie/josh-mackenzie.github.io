{%- assign cv = site.data.cv -%}
{%- if page.title -%}{%- assign page_title = page.title | append: " · " | append: site.title -%}{%- else -%}{%- assign page_title = site.title | append: " · " | append: site.description -%}{%- endif -%}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ cv.summary | join: " " | escape }}">
<link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ cv.summary | join: " " | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:type" content="profile">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"{{ cv.basics.name }}","jobTitle":"{{ cv.basics.role }}","url":"{{ site.url }}","sameAs":["https://github.com/{{ cv.basics.github }}","https://www.linkedin.com/in/{{ cv.basics.linkedin }}/"]}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231e5b45'/%3E%3Ctext x='16' y='21.5' font-family='Helvetica,Arial,sans-serif' font-size='14' font-weight='700' fill='%23f7f6f2' text-anchor='middle'%3EJM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
