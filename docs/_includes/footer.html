{%- assign cv = site.data.cv -%}
<footer class="site-footer">
    <div class="wrap">
        <div class="site-footer__inner">
            <span>{{ cv.basics.name }} · {{ cv.basics.role }}</span>
            <span class="site-footer__links">
                <a href="mailto:{{ cv.basics.email }}">Email</a>
                <a href="https://www.linkedin.com/in/{{ cv.basics.linkedin }}/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/{{ cv.basics.github }}" target="_blank" rel="noopener">GitHub</a>
                <a href="{{ '/assets/pdf/josh-mackenzie-cv.pdf' | relative_url }}" target="_blank" rel="noopener">CV</a>
            </span>
        </div>
    </div>
</footer>
